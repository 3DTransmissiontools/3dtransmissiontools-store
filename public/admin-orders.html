<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Store Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #111;
}

.page {
  max-width: 1000px;
  margin: 0 auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.login {
  max-width: 450px;
  margin: 80px auto;
  padding: 28px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.login input,
.tracking-input {
  width: 100%;
  padding: 11px;
  margin-top: 10px;
  font-size: 16px;
}

button {
  padding: 10px 14px;
  margin-top: 10px;
  cursor: pointer;
  border: 0;
  border-radius: 6px;
  background: #111;
  color: white;
  font-weight: bold;
}

button.secondary {
  background: #666;
}

button.danger {
  background: #a40000;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.order {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.admin-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  border-bottom: 1px solid #ccc;
}

.admin-tabs button {
  margin: 0 0 -1px;
  border-radius: 6px 6px 0 0;
  background: #666;
}

.admin-tabs button.active {
  background: #111;
}

.inventory-help {
  margin: 0 0 18px;
}

.inventory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}

.inventory-card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.inventory-card h3 {
  margin-top: 0;
}

.stock-count {
  font-size: 24px;
  font-weight: bold;
  margin: 12px 0;
}

.restock-controls {
  display: flex;
  align-items: end;
  gap: 10px;
}

.restock-controls label {
  flex: 1;
}

.restock-input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  font-size: 16px;
}

.order-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.items {
  padding-left: 20px;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 13px;
}

.status.shipped {
  background: #d9f4df;
  color: #155724;
}

.status.pending {
  background: #fff1c7;
  color: #684f00;
}

.message {
  padding: 14px;
  margin-bottom: 18px;
  border-radius: 7px;
  background: white;
}

.error {
  color: #a40000;
}

.muted {
  color: #666;
}

.hidden {
  display: none;
}

@media (max-width: 700px) {
  body {
    padding: 15px;
  }

  .order-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div id="login-view" class="login">
  <h1>Store Admin Dashboard</h1>
  <p>Enter your admin password.</p>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Admin password"
  >

  <button id="login-button" type="button">
    Sign In
  </button>

  <div
    id="login-error"
    class="error"
    role="alert"
  ></div>
</div>

<div id="dashboard-view" class="page hidden">
  <div class="header">
    <div>
      <h1>Store Admin</h1>
      <div class="muted">Manage orders and inventory</div>
    </div>

    <div>
      <button
        id="refresh-button"
        type="button"
      >
        Refresh
      </button>

      <button
        id="logout-button"
        class="secondary"
        type="button"
      >
        Sign Out
      </button>
    </div>
  </div>

  <nav class="admin-tabs" aria-label="Admin sections">
    <button
      id="orders-tab"
      class="active"
      type="button"
      aria-controls="orders-panel"
      aria-selected="true"
    >
      Orders
    </button>

    <button
      id="inventory-tab"
      type="button"
      aria-controls="inventory-panel"
      aria-selected="false"
    >
      Inventory
    </button>
  </nav>

  <div
    id="message"
    class="message hidden"
    role="status"
  ></div>

  <section id="orders-panel">
    <h2>Orders</h2>
    <div id="order-count" class="muted"></div>
    <div id="orders"></div>
  </section>

  <section id="inventory-panel" class="hidden">
    <h2>Inventory</h2>
    <p class="inventory-help">
      Enter the number of newly received units. Restocking adds to the
      current available quantity; it never replaces it.
    </p>
    <div id="inventory-count" class="muted"></div>
    <div id="inventory" class="inventory-grid"></div>
  </section>
</div>

<script>
const loginView =
  document.getElementById("login-view")

const dashboardView =
  document.getElementById("dashboard-view")

const passwordInput =
  document.getElementById("password")

const loginButton =
  document.getElementById("login-button")

const loginError =
  document.getElementById("login-error")

const ordersContainer =
  document.getElementById("orders")

const inventoryContainer =
  document.getElementById("inventory")

const inventoryCount =
  document.getElementById("inventory-count")

const ordersPanel =
  document.getElementById("orders-panel")

const inventoryPanel =
  document.getElementById("inventory-panel")

const ordersTab =
  document.getElementById("orders-tab")

const inventoryTab =
  document.getElementById("inventory-tab")

const messageElement =
  document.getElementById("message")

let activeSection = "orders"

function showMessage(text, isError = false) {
  messageElement.textContent = text
  messageElement.classList.remove("hidden")
  messageElement.classList.toggle("error", isError)
}

function hideMessage() {
  messageElement.textContent = ""
  messageElement.classList.add("hidden")
  messageElement.classList.remove("error")
}

function setDashboardVisible(visible) {
  loginView.classList.toggle("hidden", visible)
  dashboardView.classList.toggle("hidden", !visible)
}

function formatMoney(value) {
  return "$" + Number(value || 0).toFixed(2)
}

function formatDate(value) {
  const date = new Date(value)

  if (Number.isNaN(date.getTime())) {
    return value || ""
  }

  return date.toLocaleString()
}

function appendTextLine(parent, label, value) {
  const line = document.createElement("div")
  const strong = document.createElement("strong")

  strong.textContent = label + ": "
  line.appendChild(strong)
  line.appendChild(
    document.createTextNode(String(value ?? ""))
  )

  parent.appendChild(line)
}

function createAddressBlock(address = {}) {
  const block = document.createElement("div")

  const lines = [
    address.line1,
    address.line2,
    [
      address.city,
      address.state,
      address.postal_code
    ].filter(Boolean).join(" "),
    address.country
  ].filter(Boolean)

  if (!lines.length) {
    block.textContent = "No shipping address available."
    return block
  }

  lines.forEach(text => {
    const line = document.createElement("div")
    line.textContent = text
    block.appendChild(line)
  })

  return block
}

function createItemsList(items = []) {
  const list = document.createElement("ul")
  list.className = "items"

  items.forEach(item => {
    const listItem = document.createElement("li")

    listItem.textContent =
      `${item.name} â€” Qty ${item.quantity} â€” ` +
      `${formatMoney(item.price)}`

    list.appendChild(listItem)
  })

  return list
}

function createOrderCard(order) {
  const card = document.createElement("section")
  card.className = "order"

  const title = document.createElement("h2")
  title.textContent =
    order.customer_name ||
    order.customer_email ||
    "Customer Order"

  card.appendChild(title)

  const status = document.createElement("span")
  status.className =
    "status " +
    (order.shipped ? "shipped" : "pending")

  status.textContent =
    order.shipped ? "Shipped" : "Not Shipped"

  card.appendChild(status)

  const grid = document.createElement("div")
  grid.className = "order-grid"

  const details = document.createElement("div")
  appendTextLine(details, "Order", order.id)
  appendTextLine(details, "Date", formatDate(order.date))
  appendTextLine(
    details,
    "Email",
    order.customer_email || ""
  )
  appendTextLine(
    details,
    "Payment",
    order.payment_status || ""
  )
  appendTextLine(
    details,
    "Subtotal",
    formatMoney(order.subtotal)
  )
  appendTextLine(
    details,
    "Shipping",
    formatMoney(order.shipping_amount)
  )
  appendTextLine(
    details,
    "Tax",
    formatMoney(order.tax)
  )
  appendTextLine(
    details,
    "Total",
    formatMoney(order.amount_total)
  )

  const shipping = document.createElement("div")
  const shippingTitle = document.createElement("strong")
  shippingTitle.textContent = "Shipping Address"

  shipping.appendChild(shippingTitle)
  shipping.appendChild(
    createAddressBlock(order.shipping_address)
  )

  grid.appendChild(details)
  grid.appendChild(shipping)

  card.appendChild(grid)

  const itemTitle = document.createElement("h3")
  itemTitle.textContent = "Items"
  card.appendChild(itemTitle)
  card.appendChild(createItemsList(order.items))

  const trackingLabel = document.createElement("label")
  trackingLabel.textContent = "Tracking number"

  const trackingInput = document.createElement("input")
  trackingInput.className = "tracking-input"
  trackingInput.type = "text"
  trackingInput.maxLength = 100
  trackingInput.value = order.tracking || ""
  trackingInput.placeholder = "Tracking number"

  trackingLabel.appendChild(trackingInput)
  card.appendChild(trackingLabel)

  const saveButton = document.createElement("button")
  saveButton.type = "button"
  saveButton.textContent =
    order.shipped
      ? "Update Tracking"
      : "Mark Shipped"

  saveButton.addEventListener("click", async () => {
    await updateOrder(
      order.id,
      true,
      trackingInput.value,
      saveButton
    )
  })

  card.appendChild(saveButton)

  if (order.shipped) {
    const undoButton = document.createElement("button")
    undoButton.type = "button"
    undoButton.className = "danger"
    undoButton.textContent = "Mark Not Shipped"

    undoButton.addEventListener("click", async () => {
      await updateOrder(
        order.id,
        false,
        trackingInput.value,
        undoButton
      )
    })

    card.appendChild(
      document.createTextNode(" ")
    )

    card.appendChild(undoButton)
  }

  return card
}

function renderOrders(orders) {
  ordersContainer.replaceChildren()

  document.getElementById("order-count").textContent =
    `${orders.length} order` +
    `${orders.length === 1 ? "" : "s"}`

  if (!orders.length) {
    const empty = document.createElement("div")
    empty.className = "message"
    empty.textContent = "No paid orders were found."

    ordersContainer.appendChild(empty)
    return
  }

  orders.forEach(order => {
    ordersContainer.appendChild(
      createOrderCard(order)
    )
  })
}

function setActiveSection(section) {
  activeSection = section === "inventory" ? "inventory" : "orders"
  const showInventory = activeSection === "inventory"

  ordersPanel.classList.toggle("hidden", showInventory)
  inventoryPanel.classList.toggle("hidden", !showInventory)
  ordersTab.classList.toggle("active", !showInventory)
  inventoryTab.classList.toggle("active", showInventory)
  ordersTab.setAttribute("aria-selected", String(!showInventory))
  inventoryTab.setAttribute("aria-selected", String(showInventory))
}

function createInventoryCard(product) {
  const card = document.createElement("section")
  card.className = "inventory-card"

  const title = document.createElement("h3")
  title.textContent = product.name
  card.appendChild(title)

  const id = document.createElement("div")
  id.className = "muted"
  id.textContent = `Product ID: ${product.id}`
  card.appendChild(id)

  const stock = document.createElement("div")
  stock.className = "stock-count"
  stock.textContent = `${product.stock_available} available`
  card.appendChild(stock)

  const controls = document.createElement("div")
  controls.className = "restock-controls"

  const label = document.createElement("label")
  label.textContent = "New units to add"

  const input = document.createElement("input")
  input.className = "restock-input"
  input.type = "number"
  input.min = "1"
  input.max = "1000"
  input.step = "1"
  input.inputMode = "numeric"
  input.placeholder = "Quantity"
  input.setAttribute("aria-label", `Restock quantity for ${product.name}`)

  label.appendChild(input)
  controls.appendChild(label)

  const button = document.createElement("button")
  button.type = "button"
  button.textContent = "Add Stock"

  button.addEventListener("click", async () => {
    const quantity = input.valueAsNumber

    if (
      !Number.isInteger(quantity) ||
      quantity < 1 ||
      quantity > 1000
    ) {
      showMessage(
        "Enter a whole-number restock quantity from 1 to 1000.",
        true
      )
      input.focus()
      return
    }

    const confirmed = window.confirm(
      `Add ${quantity} unit${quantity === 1 ? "" : "s"} ` +
      `to ${product.name}? Current available stock is ` +
      `${product.stock_available}.`
    )

    if (!confirmed) return

    await addStock(product, quantity, button)
  })

  controls.appendChild(button)
  card.appendChild(controls)
  return card
}

function renderInventory(products) {
  inventoryContainer.replaceChildren()

  const activeProducts = products.filter(product => product.active)

  inventoryCount.textContent =
    `${activeProducts.length} active product` +
    `${activeProducts.length === 1 ? "" : "s"}`

  if (!activeProducts.length) {
    const empty = document.createElement("div")
    empty.className = "message"
    empty.textContent = "No active products were found."
    inventoryContainer.appendChild(empty)
    return
  }

  activeProducts.forEach(product => {
    inventoryContainer.appendChild(createInventoryCard(product))
  })
}

async function adminFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    credentials: "same-origin"
  })
}

async function loadOrders() {
  hideMessage()
  showMessage("Loading orders...")

  try {
    const response = await adminFetch("/api/orders")
    const data = await response.json()

    if (response.status === 401) {
      setDashboardVisible(false)
      loginError.textContent =
        "Your admin session expired. Please sign in again."
      return
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Unable to load orders."
      )
    }

    hideMessage()
    renderOrders(data)
  } catch (error) {
    showMessage(error.message, true)
  }
}

async function loadInventory() {
  hideMessage()
  showMessage("Loading inventory...")

  try {
    const response = await adminFetch("/api/inventory")
    const data = await response.json()

    if (response.status === 401) {
      setDashboardVisible(false)
      loginError.textContent =
        "Your admin session expired. Please sign in again."
      return
    }

    if (!response.ok) {
      throw new Error(data.error || "Unable to load inventory.")
    }

    hideMessage()
    renderInventory(data)
  } catch (error) {
    showMessage(error.message, true)
  }
}

async function addStock(product, quantity, button) {
  const originalText = button.textContent
  button.disabled = true
  button.textContent = "Adding..."

  try {
    const response = await adminFetch("/api/inventory", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: product.id,
        quantity
      })
    })

    const data = await response.json()

    if (response.status === 401) {
      setDashboardVisible(false)
      loginError.textContent =
        "Your admin session expired. Please sign in again."
      return
    }

    if (!response.ok) {
      throw new Error(data.error || "Unable to add inventory.")
    }

    await loadInventory()

    showMessage(
      `Added ${quantity} unit${quantity === 1 ? "" : "s"} to ` +
      `${data.product.name}. New available stock: ` +
      `${data.product.stock_available}.`
    )
  } catch (error) {
    showMessage(error.message, true)
    button.disabled = false
    button.textContent = originalText
  }
}

async function loadActiveSection() {
  if (activeSection === "inventory") {
    await loadInventory()
    return
  }

  await loadOrders()
}

async function updateOrder(
  id,
  shipped,
  tracking,
  button
) {
  const originalText = button.textContent

  button.disabled = true
  button.textContent = "Saving..."

  try {
    const response = await adminFetch(
      "/api/orders",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id,
          shipped,
          tracking
        })
      }
    )

    const data = await response.json()

    if (!response.ok) {
      throw new Error(
        data.error || "Unable to update order."
      )
    }

    showMessage("Order updated.")
    await loadOrders()
  } catch (error) {
    showMessage(error.message, true)
    button.disabled = false
    button.textContent = originalText
  }
}

async function signIn() {
  const password = passwordInput.value

  if (!password) {
    loginError.textContent =
      "Enter your admin password."
    return
  }

  loginButton.disabled = true
  loginButton.textContent = "Signing In..."
  loginError.textContent = ""

  try {
    const response = await adminFetch(
      "/api/admin-session",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      }
    )

    const data = await response.json()

    if (!response.ok) {
      loginError.textContent =
        data.error || "Unable to sign in."

      return
    }

    passwordInput.value = ""
    setDashboardVisible(true)
    setActiveSection("orders")
    await loadActiveSection()
  } catch (error) {
    loginError.textContent =
      "Unable to connect to the order service."
  } finally {
    loginButton.disabled = false
    loginButton.textContent = "Sign In"
  }
}

loginButton.addEventListener("click", signIn)

passwordInput.addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") {
      signIn()
    }
  }
)

document
  .getElementById("refresh-button")
  .addEventListener("click", loadActiveSection)

ordersTab.addEventListener("click", async () => {
  setActiveSection("orders")
  await loadOrders()
})

inventoryTab.addEventListener("click", async () => {
  setActiveSection("inventory")
  await loadInventory()
})

document
  .getElementById("logout-button")
  .addEventListener("click", async () => {
    await adminFetch("/api/admin-session", {
      method: "DELETE"
    })
    passwordInput.value = ""
    setActiveSection("orders")
    setDashboardVisible(false)
  })

async function restoreSession() {
  try {
    const response = await adminFetch("/api/admin-session")
    const data = await response.json()

    if (response.ok && data.authenticated) {
      setDashboardVisible(true)
      await loadActiveSection()
    }
  } catch (error) {
    console.error("Unable to restore admin session:", error)
  }
}

restoreSession()
</script>

</body>
</html>
