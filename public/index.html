<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Transmission Tools</title>
<link rel="stylesheet" href="/styles.css">
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header class="site-header">
  <div class="banner">
    <img src="/banner.png" alt="3D Transmission Tools">
  </div>
  <nav class="sticky-nav">
<div class="nav-inner">
<a href="/">Home</a>
<a href="/shop.html">Shop</a>
<a href="/cart.html">Cart (<span id="cart-count">0</span>)</a>
<a href="https://www.ebay.com/usr/3dtransmissiontools"
   target="_blank"
   rel="noopener noreferrer">eBay Store</a>
</div>
</nav>
</header>

<section class="hero">
  <h2>Precision Tools for Transmission Work</h2>
  <p>
    Browse specialized tools for GM, Ford, Allison, and other transmission applications.
    Built to help make service work faster, easier, and more repeatable.
  </p>
  <p><a href="/shop.html">View All Products</a></p>
</section>

<section class="section">
  <h3>Featured Products</h3>
  <div id="products" class="home-grid"></div>
</section>

<footer>© 2026 3D Transmission Tools</footer>

<div
  id="lightbox"
  class="lightbox"
  aria-hidden="true"
  onclick="closeProductMedia(event)"
>
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <button
      class="close-btn"
      type="button"
      aria-label="Close gallery"
      onclick="closeProductMedia(event)"
    >×</button>

    <div id="lightbox-media" class="lightbox-media"></div>

    <div class="lightbox-controls">
      <button type="button" onclick="previousProductMedia()">‹ Prev</button>
      <div id="lightbox-counter" class="lightbox-counter">1 / 1</div>
      <button type="button" onclick="nextProductMedia()">Next ›</button>
    </div>

    <div id="thumbnail-strip" class="thumbnail-strip"></div>
  </div>
</div>

<script src="/cart.js"></script>
<script src="/product-media.js"></script>
<script>
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getSafeMaxQty(product) {
  const stock = Number(product.quantity ?? 0);
  return Number.isFinite(stock) && stock > 0
    ? Math.min(stock, 99)
    : 0;
}

function changeQty(inputId, delta) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const min = Number(input.min || 1);
  const max = Number(input.max || 99);
  const current = Number(input.value || min);

  input.value = Math.max(min, Math.min(max, current + delta));
}

function getQty(productId) {
  const input = document.getElementById("qty-" + productId);
  if (!input) return 1;

  const min = Number(input.min || 1);
  const max = Number(input.max || 99);
  let value = Number(input.value || 1);

  if (!Number.isInteger(value) || value < min) value = min;
  if (value > max) value = max;

  input.value = value;
  return value;
}

async function loadProducts() {
  const container = document.getElementById("products");

  try {
    const response = await fetch("/products.json");
    if (!response.ok) throw new Error("Unable to load products.");

    const products = await response.json();
    const featuredIds = ["21", "17", "9", "4"];

    const featuredProducts = featuredIds
      .map(id => products.find(product => String(product.id) === id))
      .filter(Boolean);

    featuredProducts.forEach(product => {
      const card = document.createElement("article");
      card.className = "home-card";

      const media = getProductMedia(product);
      const encodedMedia = encodeProductMedia(media);
      const safeId = String(product.id);
      const safeName = escapeHtml(product.name);
      const safeCategory = escapeHtml(product.category || "General");
      const safeDescription = escapeHtml(product.description || "");
      const maxQty = getSafeMaxQty(product);
      const outOfStock = maxQty === 0;

      card.innerHTML = `
        <div class="image-box">
          ${getProductCardMediaHtml(media, safeName, encodedMedia)}
        </div>
        <div class="card-content">
          <div class="category">${safeCategory}</div>
          <h4>${safeName}</h4>
          <div class="description">${safeDescription}</div>
          <div class="price">$${Number(product.price).toFixed(2)}</div>
          <div class="stock">${outOfStock ? "Out of stock" : `In stock: ${maxQty}`}</div>
          <div class="quantity-wrap">
            <div class="quantity-label">Qty</div>
            <div class="quantity-controls">
              <button type="button" onclick="changeQty('qty-${safeId}', -1)" ${outOfStock ? "disabled" : ""}>−</button>
              <input id="qty-${safeId}" type="number" min="1" max="${Math.max(maxQty, 1)}" value="1" inputmode="numeric" ${outOfStock ? "disabled" : ""}>
              <button type="button" onclick="changeQty('qty-${safeId}', 1)" ${outOfStock ? "disabled" : ""}>+</button>
            </div>
          </div>
          <button class="buy-btn" type="button" onclick="addProductToCart('${safeId.replace(/'/g, "\\'")}')" ${outOfStock ? "disabled" : ""}>
            ${outOfStock ? "Out of Stock" : "Add To Cart"}
          </button>
        </div>
      `;

      container.appendChild(card);
    });
  } catch (error) {
    console.error("Failed to load products:", error);
    container.innerHTML = '<div class="empty-message">Unable to load products right now.</div>';
  }
}

function addProductToCart(id) {
  addToCart(id, getQty(id));

  va("event", {
    name: "add_to_cart",
    data: { product_id: id }
  });
}

loadProducts();
</script>
</body>
</html>
